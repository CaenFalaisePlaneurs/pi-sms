# Huawei E3372 HiLink modem configuration.
# The modem must be reachable at this address (see README "Modem networking" section
# for the eth1 network profile set up by `pi-sms-setup`).
modem:
  base_url: "http://192.168.8.1"
  request_timeout_seconds: 10

# SMS inbox polling configuration.
poll:
  interval_seconds: 30 # How often to check the modem's SMS inbox

# Filtering: messages matching any pattern below are deleted from the modem
# without creating a Trello card. Patterns are Python regex, matched against
# the raw SMS content (case-sensitive by default, use (?i) for case-insensitive).
filter:
  exclude_patterns:
    - '^Messagerie "666" Free:' # Free Mobile voicemail notification

# MMS auto-reply: the modem cannot retrieve MMS content, so an incoming MMS
# is detected (empty content from a real sender number) and answered with a
# reply asking the sender to resend as SMS. Phones often send a long text as
# MMS once it exceeds one SMS (160 GSM-7 / 70 Unicode characters), the same
# as for photos and attachments. No Trello card is created for the MMS
# itself; a plain-text SMS follow-up creates one through the normal flow.
# Senders that cannot be replied to (alphanumeric IDs, short codes) are
# silently discarded. ignore_sender_max_digits (default 5) is the cutoff:
# senders with that many digits or fewer get no auto-reply and no Trello SMS.
mms:
  enabled: true
  ignore_sender_max_digits: 5
  reply_text: >-
    Ce numéro ne lit pas les MMS (photos, pièces jointes, ou textes trop
    longs que le téléphone envoie en MMS). Merci de renvoyer en SMS texte,
    au besoin en plusieurs messages, ou par email à
    contact@caenfalaiseplaneurs.fr

# Trello configuration: one card per phone number, in the configured list.
# The first SMS from a number creates a card; later SMS from the same number
# are appended as comments on that card so it reads as a conversation.
# Matching is done by phone number substring in the card name, so
# card_name_template must include {phone}.
# Create an API key at https://trello.com/power-ups/admin (or https://trello.com/app-key)
# and a token by visiting the authorize URL it gives you.
# The list_id is the destination Trello list ID (open the list menu > "..." > and
# use the Trello API `GET /1/boards/{id}/lists` to find it, or the card URL JSON).
trello:
  key: "your-trello-api-key"
  token: "your-trello-api-token"
  list_id: "your-trello-list-id"
  card_name_template: "SMS from {phone}"
  card_desc_template: "{content}"
  card_comment_template: "{content}"

# SMS reply: a team member replies to an SMS conversation by writing a
# comment on the card containing the trigger below. Text before the trigger
# is free-form attribution/notes kept only in Trello; text after it (with
# internal newlines preserved) is sent verbatim as the SMS to the number in
# the card name. Trello only lets the original author of a comment edit it,
# and a reply may be written from any team member's own Trello login, so
# status is recorded as a *new* comment referencing the reply, not by
# editing the reply itself - this works regardless of who wrote it:
#
#   Nico - pas de reponse a ce jour, je renvoie un sms
#   >>RE: Etes vous toujours interessé?
#   Ou preferez vous un remboursement?
#   Merci.
#
# once sent, a new comment is posted on the card:
#
#   [Réponse envoyée le 17/07/2026 a 12:26] (réf: 66f...)
#
# and, if the send fails, a one-time failure notice is posted instead, after
# which the send is retried silently every poll until it succeeds:
#
#   [Echec d'envoi, nouvelle tentative en cours] (réf: 66f...)
reply:
  enabled: true
  trigger: ">>RE:"
  case_insensitive: true
  poll_interval_seconds: 30
  sent_marker: "[Réponse envoyée"
  sent_tag_template: "[Réponse envoyée le {date} a {time}]"
  failure_marker: "[Echec d'envoi"
  failure_tag_template: "[Echec d'envoi, nouvelle tentative en cours]"
  # Persisted cursor, reply send state, and MMS auto-reply markers. Reply polls
  # fetch only new board comments instead of listing every card.
  # systemd StateDirectory=pi-sms creates this dir.
  sqlite_path: "/var/lib/pi-sms/reply.sqlite"

# Debug mode (for development/testing only)
# Enable via DEBUG_MODE environment variable (DEBUG_MODE=true)
# When enabled, uses a faster poll interval than poll.interval_seconds
debug:
  poll_interval_seconds: 5
